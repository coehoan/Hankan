function produce(type){let content={tofu:'<path d="m15 24 20-10 26 12-22 11Z" fill="#fff5dd"/><path d="m15 24 24 13v26L15 49Z" fill="#e9d7af"/><path d="m39 37 22-11v26L39 63Z" fill="#f2e5c9"/><path d="m22 25 13-6m7 10 10-4m-31 9v9m6-4v9m17-3 9-4" stroke="#c9b894" stroke-width="1.3" opacity=".6"/>',mushroom:'<path d="M25 37h8l1 26H22Z" fill="#e9dcc7"/><path d="M49 32h8l5 31H47Z" fill="#e5d2b8"/><path d="M11 37c2-21 34-22 35 0-13 7-22 7-35 0Z" fill="#ac8b68"/><path d="M35 32c2-20 34-20 35 0-11 7-23 8-35 0Z" fill="#c0a080"/><path d="m17 36 12-5m11 1 14-7" stroke="#806248" opacity=".4" stroke-width="1.2"/>',spinach:'<path d="m38 66-6-32m6 32 15-32m-15 32 4-39" stroke="#6b9a4b" stroke-width="3" stroke-linecap="round"/><path d="M31 48C7 45 8 17 25 15c16-2 22 25 6 33Z" fill="#8caf63"/><path d="M45 49c-13-20 1-43 17-34 18 11-1 32-17 34Z" fill="#648a48"/><path d="M39 43c-19-11-16-36-1-35 19 1 17 27 1 35Z" fill="#a6bf75"/><path d="m25 22 9 23m24-22-12 21m-8-29 2 25" stroke="#477437" opacity=".5" stroke-width="1.3"/>',egg:'<ellipse cx="39" cy="65" rx="20" ry="4" fill="#dfd3bd" opacity=".3"/><path d="M60 43c3 17-6 23-20 23S17 60 20 43C22 28 33 10 40 10s18 18 20 33Z" fill="#e2bf89"/><path d="M40 10c10 4 19 23 20 33 3 16-6 23-20 23 10-10 12-39 0-56Z" fill="#c79f6a" opacity=".45"/><ellipse cx="31" cy="34" rx="4" ry="10" transform="rotate(21 31 34)" fill="#f3d7ac" opacity=".8"/>',leek:'<path d="m29 64 8-29 9 3-6 29Z" fill="#f0eacb"/><path d="m37 35 9 3L62 9l-8-3Z" fill="#719456"/><path d="m32 39 6 2L35 8l-9 1Z" fill="#a0ba75"/><path d="m42 38 7 3 18-22-6-6Z" fill="#4e7b44"/><path d="m29 64-4 7m9-6-2 8m6-6 2 7" stroke="#b69c6e" stroke-width="1"/><path d="m39 34 4-15" stroke="#c4d497" stroke-width="1.1"/>',jar:'<rect x="20" y="24" width="40" height="42" rx="10" fill="#c6aa7e"/><path d="M43 24h7c6 0 10 4 10 10v22c0 6-4 10-10 10h-7Z" fill="#ad8f64" opacity=".5"/><rect x="18" y="18" width="44" height="11" rx="4" fill="#73835b"/><rect x="26" y="38" width="28" height="17" rx="3" fill="#f3e8cd"/><path d="M34 44h12m-10 5h8" stroke="#a78b60" stroke-width="1.3"/>',rice:'<path d="m25 14 29 1 8 48c-14 7-29 6-43 0Z" fill="#dbc9a3"/><path d="M26 14c7 4 19 4 27 1" stroke="#ab956c" stroke-width="2"/><path d="m54 15 8 48-11 4-6-49Z" fill="#c8b68e" opacity=".6"/><rect x="27" y="29" width="26" height="25" rx="4" fill="#f9f4e1"/><path d="m37 47 6-12m-9 8 3 2m3-7 3 2m-5-1-3-1m7-3 2 2" stroke="#9baf7b" stroke-width="1.6" stroke-linecap="round"/>'}[type]||'';return `<svg viewBox="0 0 80 80" fill="none" aria-hidden="true">${content}</svg>`}
function foodRow(f,mini){return `<article class="p-food-row"><div class="produce-icon">${produce(f.type)}</div><div><div class="p-food-name">${esc(f.name)}${f.left?`<span class="p-deadline">${f.left}</span>`:''}</div><div class="p-meta"><span>${f.place}</span><span>·</span><span>${f.date}까지</span></div></div><div class="p-quantity"><div><span>남은 양</span><b>${f.amount}%</b></div><input aria-label="${esc(f.name)} 남은 양" type="range" min="0" max="100" step="5" value="${f.amount}" ${mini?'disabled':''} data-amount="${f.id}"><small><button ${mini?'disabled':''} data-delete="${f.id}">다 먹었어요 · 삭제</button></small></div></article>`}
function foodList(mini){const list=mini?foods.slice(0,4):foods.filter(f=>filter==='전체'||f.place===filter);const urgent=list.filter(f=>f.left),other=list.filter(f=>!f.left);return (urgent.length?`<div class="food-group-head"><strong>먼저 먹어요 · ${urgent.length}개</strong><span class="sort">기한이 가까운 순</span></div>`+urgent.map(f=>foodRow(f,mini)).join(''):'')+(other.length?`<div class="food-group-head calm"><strong>아직 여유 있어요 · ${mini?foods.filter(f=>!f.left).length:other.length}개</strong><span class="sort">기한이 가까운 순</span></div>`+other.map(f=>foodRow(f,mini)).join(''):'')||'<div class="inventory-empty">해당하는 재료가 없어요.</div>'}
let notificationTime='09:00',notificationEnabled=false,inviteCreated=false;let members=[{id:'owner',name:'나',role:'소유자'},{id:'member',name:'지민',role:'멤버'}];
function fridge(mini){return `<div class="p-intro"><div><div class="p-kicker">FRESH INGREDIENTS, LESS WASTE</div><h2>우리집 냉장고<span class="count">${foods.length}개</span></h2><p class="p-sub">잊고 있던 재료도, 맛있는 한 끼가 될 수 있어요.</p></div><button class="p-add" data-add>＋ 재료 등록</button></div><div class="sharing-context"><div class="sharing-label"><span class="sharing-dot"></span><strong>같은 재료를 함께 관리해요</strong><span class="sharing-sub">내가 소유한 공유 냉장고</span></div><button class="sharing-members" data-members><span class="member-pips">${members.slice(0,3).map(m=>`<span>${m.name.slice(0,1)}</span>`).join('')}</span><span>멤버 ${members.length}명 · 초대</span><span aria-hidden="true">↗</span></button></div><div class="p-columns"><section><div class="p-tools"><div class="p-filters" aria-label="보관 장소">${['전체','냉장','냉동','실온'].map(x=>`<button class="${(mini?'전체':filter)===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><label class="p-search">${searchIcon}<input placeholder="재료 이름 검색" aria-label="재료 이름 검색" ${mini?'disabled':''}></label></div><div class="food-block">${foodList(mini)}</div></section><aside class="p-aside"><div class="p-recommend"><div class="style-ornament">${leaf}</div><div class="p-tiny">먼저 먹으면 좋은 재료로</div><h3>오늘은 두부랑 버섯,<br>같이 먹어볼까요?</h3><p class="reco-copy">기한이 가까운 재료를 활용하는<br>요리를 먼저 추천해 드려요.</p><div class="p-bowl">${bowl}</div><p class="dish-label">두부 버섯 된장국</p><p class="dish-time">보유 재료 활용 · 15분</p><button class="p-add" data-page="recipes">추천 요리 보러 가기 ↗</button></div><div class="p-notice"><div class="p-notice-top">${bell}<strong>내가 정한 시간에, 알림으로</strong></div><p>기한이 가까운 재료를 하루 한 번<br>모아서 알려드려요.</p><div class="notice-time"><span>매일 ${notificationTime}</span><small>${notificationEnabled?'알림 켜짐 · 예시':'알림 꺼짐'}</small></div><button data-notice>내 알림 시간 설정 →</button></div><p class="p-footnote">내 냉장고 속 작은 변화가<br>버리는 재료를 줄이는 시작이 돼요.</p></aside></div>`}
function recipes(){return `<div class="p-intro"><div><div class="p-kicker">A FRESH IDEA FOR YOUR NEXT MEAL</div><h2>오늘 뭐 먹지?</h2><p class="p-sub">기한이 가까운 재료부터 맛있게 활용해 보세요.</p></div><button class="p-add" data-page="fridge">내 재료 보기</button></div><div class="recipe-view"><h3>보유 재료로 만들어요</h3><div class="recipe-card-grid"><article class="dish-card"><div class="dish-art">${bowl}</div><span class="dish-tag">임박 재료 2개 활용</span><h4>두부 버섯 된장국</h4><p>두부 · 느타리버섯 · 대파 · 된장<br>15분 · 1인분</p><button class="p-add" data-recipe>조리법 보기 →</button></article></div><h3>조금만 더 사면 만들어요</h3><div class="recipe-card-grid">${[{name:'대파 달걀 볶음밥',missing:'식용유 · 소금',time:10},{name:'시금치 크림 파스타',missing:'파스타면 · 생크림 · 소금',time:20}].map(r=>`<article class="dish-card"><span class="dish-tag missing">추가 구매 필요</span><h4>${r.name}</h4><p>더 필요해요: ${r.missing}<br>${r.time}분 · 1인분</p><button class="p-add" data-recipe>조리법 보기 →</button></article>`).join('')}</div></div>`}
function product(id,mini=false){return `<div class="product theme-${id}"><header class="product-head"><div class="p-brand"><span class="brand-symbol">${leaf}</span>한칸<small>냉장고를 가볍게, 한 끼를 맛있게</small></div><nav class="p-nav" aria-label="시안 메뉴"><button class="${mini||currentPage==='fridge'?'active':''}" data-page="fridge">내 냉장고</button><button class="${!mini&&currentPage==='recipes'?'active':''}" data-page="recipes">요리 추천</button></nav><div class="p-theme-picker" role="group" aria-label="화면 테마"><button class="${id==='mint'?'active':''}" data-mode="mint" aria-label="라이트 모드로 전환" aria-pressed="${id==='mint'}">☀</button><button class="${id==='mint-dark'?'active':''}" data-mode="mint-dark" aria-label="다크 모드로 전환" aria-pressed="${id==='mint-dark'}">☾</button></div></header><main class="p-body">${mini||currentPage==='fridge'?fridge(mini):recipes()}</main></div>`}
function notificationSettings(){
 modal('내 알림 시간',`<p>공유 냉장고를 함께 쓰더라도 알림은 각자 정한 시간에 받아요.</p><form id="notification-form"><label class="settings-check"><input type="checkbox" name="enabled" ${notificationEnabled?'checked':''}>기한 알림 받기</label><label>매일 받을 시간<input type="time" name="time" value="${notificationTime}" step="60" required></label><p class="setting-tip">내가 참여한 냉장고의 임박 재료를 한 번에 모아 알려드려요. 다른 멤버의 설정은 바뀌지 않아요.</p><p>화면 확인용 시안으로 실제 알림 권한을 요청하거나 발송하지 않아요.</p><div class="modal-actions"><button type="button" data-close>취소</button><button type="submit">내 설정 저장</button></div></form>`);
}
function memberSettings(){
 const rows=members.map(m=>`<div class="member-row"><span class="member-avatar">${m.name.slice(0,1)}</span><div><strong>${esc(m.name)}</strong><small>${m.role==='소유자'?'소유자 · 나':'멤버 · 공동 편집 가능'}</small></div>${m.role==='멤버'?`<button type="button" data-remove-member="${m.id}">내보내기</button>`:''}</div>`).join('');
 const invitation=inviteCreated?`<div class="invite-result"><strong>초대 링크가 준비됐어요</strong><input aria-label="예시 초대 링크" value="https://hankan.example/invite/sample-7days" readonly><small>7일 동안 유효 · 1명 참여 후 만료 · 시안용 예시 링크</small><button type="button" data-invite-preview>초대받은 사람의 화면 보기 →</button><button type="button" data-cancel-invite>이 초대 취소</button></div>`:`<div class="invite-empty"><strong>함께 관리할 사람을 초대해 보세요</strong><p>링크를 받은 사람이 로그인 후 참여를 수락하면 같은 목록을 사용할 수 있어요.</p></div>`;
 modal('우리집 냉장고 멤버',`<p>함께 쓰는 멤버는 모두 재료 추가·수정·남은 양 변경·삭제를 할 수 있어요. 초대와 멤버 관리는 소유자가 담당해요.</p><div class="member-list">${rows}</div><p class="setting-tip">공유하는 것은 저장된 식재료 목록이에요. 각자의 영수증 원본·초안·알림 시간은 공유되지 않아요.</p>${invitation}<div class="modal-actions"><button type="button" data-close>닫기</button><button type="button" data-create-invite>${inviteCreated?'새 예시 링크 만들기':'초대 링크 만들기'}</button></div>`);
}
function invitePreview(){
 modal('우리집 냉장고에 초대받았어요',`<p>초대를 수락하면 기존 재료 목록을 함께 관리할 수 있어요. 내 개인 냉장고와 재료는 그대로 유지돼요.</p><div class="invite-permissions"><strong>함께 할 수 있는 일</strong><ul><li>재료 추가·유통기한 수정</li><li>남은 양 조절·다 먹은 재료 삭제</li><li>같은 재료로 요리 추천받기</li></ul></div><p>로그인한 사람의 참여 확인 화면 예시입니다. 이 시안에서는 실제 다른 계정이 참여하지 않아요.</p><div class="modal-actions"><button type="button" data-members>돌아가기</button><button type="button" data-accept-demo>참여 수락 예시 보기</button></div>`);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.closest('.mini-product'))return;
 if(b.hasAttribute('data-members'))memberSettings();
 if(b.hasAttribute('data-create-invite')){inviteCreated=true;memberSettings()}
 if(b.hasAttribute('data-cancel-invite')){inviteCreated=false;memberSettings();notify('예시 초대를 취소했어요.')}
 if(b.hasAttribute('data-invite-preview'))invitePreview();
 if(b.hasAttribute('data-accept-demo')){if(!members.some(m=>m.id==='new-member'))members.push({id:'new-member',name:'새 멤버',role:'멤버'});inviteCreated=false;drawFull();memberSettings();notify('참여 후의 화면 예시예요. 실제 계정은 추가되지 않아요.')}
 if(b.dataset.removeMember){members=members.filter(m=>m.id!==b.dataset.removeMember);drawFull();memberSettings();notify('시안에서 멤버를 내보냈어요. 실제 계정에는 영향이 없어요.')}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='notification-form')return;e.preventDefault();const data=new FormData(e.target);notificationTime=data.get('time');notificationEnabled=data.get('enabled')==='on';closeModal();drawFull();notify('매일 '+notificationTime+' 알림 '+(notificationEnabled?'켜짐':'꺼짐')+'으로 표시했어요. 실제 발송은 하지 않아요.');
});

function drawGallery(){el('gallery').innerHTML=directions.map(d=>`<article class="direction-card ${selected===d.id?'selected':''}" data-choice="${d.id}" id="choice-${d.id}"><div class="card-top"><h2 class="card-title"><span class="number">${d.number}</span>${d.name}<span style="color:#8d998f;font-size:10px;font-weight:400">${d.en}</span></h2><button class="open-design" data-view="${d.id}">${d.number} 크게 보기 ↗</button></div><div class="preview-space" role="img" aria-label="${d.name} 냉장고 화면 미리보기"><div class="mini-product" aria-hidden="true">${product(d.id,true)}</div></div><div class="card-bottom"><p>${d.description}</p><div class="palette" aria-label="${d.name} 색상">${d.palette.map(c=>`<span style="background:${c}"></span>`).join('')}</div></div></article>`).join('');resizeMinis()}
function resizeMinis(){document.querySelectorAll('.preview-space').forEach(x=>{x.querySelector('.mini-product').style.transform=`scale(${x.clientWidth/1040})`})}
function drawFull(){document.body.classList.toggle('theme-review-dark',active==='mint-dark');document.querySelectorAll('.presentation-bar [data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===active);b.setAttribute('aria-pressed',b.dataset.mode===active)});const d=directions.find(x=>x.id===active);if(!d)return;el('full-title').textContent=d.number+' '+d.name+' / '+d.en;el('full-description').textContent=d.description;el('selected-message').textContent=selected===d.id?'이 방향을 선택했어요. 마음에 드는 부분이나 수정할 점을 채팅에 남겨 주세요.':'';el('full-host').classList.toggle('mobile',device==='mobile');el('full-host').innerHTML=product(active);el('select-direction').textContent=selected===active?'선택한 방향 ✓':'이 방향 선택';document.querySelectorAll('[data-device]').forEach(b=>{b.classList.toggle('active',b.dataset.device===device);b.setAttribute('aria-pressed',b.dataset.device===device)})}
function view(id){active=id;currentPage='fridge';filter='전체';el('gallery').hidden=id!=='all';el('full-stage').hidden=id==='all';document.querySelectorAll('.chooser [data-view],.presentation-bar [data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===id);b.setAttribute('aria-pressed',b.dataset.view===id)});if(id==='all'){document.body.classList.remove('theme-review-dark');drawGallery()}else drawFull();if(document.body.classList.contains('presentation'))window.scrollTo(0,0);else document.querySelector('.chooser').scrollIntoView({behavior:'auto',block:'start'})}
function notify(text){el('toast').textContent=text;el('toast').hidden=false;clearTimeout(window.directionToast);window.directionToast=setTimeout(()=>el('toast').hidden=true,3200)}
function closeModal(){el('modal').hidden=true;el('modal').innerHTML='';document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus()}
function modal(title,body){el('modal').classList.toggle('dark-modal',active==='mint-dark');previousFocus=document.activeElement;el('modal').innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}</section>`;el('modal').hidden=false;document.body.style.overflow='hidden';el('modal').querySelector('button,input')?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('.mini-product'))return;if(b.dataset.view)view(b.dataset.view);if(b.dataset.device){device=b.dataset.device;drawFull()}if(b.id==='select-direction'){selected=active;const card=el('choice-'+active);if(card&&typeof window.toggleSelect==='function')window.toggleSelect(card);drawFull();notify(directions.find(d=>d.id===active).name+' 방향을 선택했어요.')}if(b.dataset.page){currentPage=b.dataset.page;drawFull()}if(b.dataset.filter){filter=b.dataset.filter;drawFull()}if(b.dataset.delete){const i=foods.findIndex(f=>f.id===Number(b.dataset.delete));if(i>=0){const name=foods[i].name;foods.splice(i,1);drawFull();notify(name+'를 시안의 목록에서 삭제했어요.')}}if(b.hasAttribute('data-add'))modal('재료 등록',`<p>각 디자인의 등록 흐름을 확인하는 시안이에요.<br>직접 입력 또는 영수증 확인 후 저장 방식을 사용합니다.</p><form id="add-form"><label>재료 이름<input name="name" required maxlength="40" placeholder="예: 방울토마토"></label><label>유통기한<input name="date" type="date" required></label><label>보관 장소<select name="place"><option>냉장</option><option>냉동</option><option>실온</option></select></label><div class="modal-actions"><button type="button" data-close>닫기</button><button type="submit">직접 입력해 저장</button></div></form>`);if(b.hasAttribute('data-notice'))notificationSettings();if(b.hasAttribute('data-recipe'))modal('조리법',`<p>선택한 요리의 재료와 단계별 조리법을 보여주는 화면으로 연결됩니다. 지금은 시각 디자인을 비교하는 단계예요.</p><div class="modal-actions"><button data-close>닫기</button></div>`);if(b.hasAttribute('data-close'))closeModal()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-presentation]');if(!b)return;document.body.classList.toggle('presentation',b.dataset.presentation==='on');document.querySelectorAll('.presentation-bar [data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===active));window.scrollTo(0,0)});
document.addEventListener('input',e=>{if(e.target.matches('#full-host [data-amount]')){const f=foods.find(x=>x.id===Number(e.target.dataset.amount));if(f){f.amount=Number(e.target.value);e.target.closest('.p-quantity').querySelector('b').textContent=f.amount+'%'}}if(e.target.matches('#full-host .p-search input')){const query=e.target.value.trim();document.querySelectorAll('#full-host .p-food-row').forEach(row=>row.hidden=!row.querySelector('.p-food-name').textContent.includes(query))}});
document.addEventListener('submit',e=>{if(e.target.id!=='add-form')return;e.preventDefault();const data=new FormData(e.target);const name=data.get('name').trim();if(!name)return;const date=data.get('date');foods.push({id:Date.now(),name,type:'spinach',place:data.get('place'),date:date.slice(5).replace('-','.'),left:'',amount:100});closeModal();drawFull();notify('시안에 재료를 추가했어요. 새로고침하면 초기화돼요.')});
el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});document.addEventListener('keydown',e=>{if(el('modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...el('modal').querySelectorAll('button,input,select')];const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});new ResizeObserver(resizeMinis).observe(el('gallery'));drawGallery();document.body.classList.add('presentation');view('mint-dark');
})();

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.closest('.mini-product'))return;
 if(b.hasAttribute('data-compare')){document.body.classList.remove('presentation');const compareButton=document.querySelector('.chooser [data-view="all"]');compareButton.click();return;}
 if(!b.dataset.mode)return;
 const modeButton=document.querySelector('.chooser [data-view="'+b.dataset.mode+'"]');
 if(!modeButton)return;
 // Keep the current screen and entered mock data when changing appearance.
 const currentRecipe=document.querySelector('#full-host .recipe-view')!==null;
 modeButton.click();
 if(currentRecipe)document.querySelector('#full-host .p-nav [data-page="recipes"]').click();
});
</script>
</body>
</html>
