name: Deploy Hankan production

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: hankan-production
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'coehoan/Hankan' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - name: Check release configuration without deploying
        run: node scripts/release-production.mjs --check-config
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.7.0
      - name: Start disposable local Supabase including Realtime
        shell: bash
        run: |
          mkdir -p work
          if ! npm run db:start -- --exclude studio,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > work/ci-supabase-start.log 2>&1; then
            echo "::error::Local Supabase did not start. No production operations have run."
            exit 1
          fi
          node scripts/ci-test-env.mjs
      - run: npm run test:release
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4
      - run: npm run test:db
      - run: npm run test:integration
      - run: npm run build:worker
      - name: Build production, apply pending migrations, then deploy
        run: node scripts/release-production.mjs --execute
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
